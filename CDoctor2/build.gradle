configurations {
    cdocDebugCompile
    dokitaDebugCompile
    cybermedi8DebugCompile
    cdocReleaseCompile
    dokitaReleaseCompile
    cybermedi8ReleaseCompile
}
android {
    compileSdk 36

    testOptions {
        unitTests.includeAndroidResources = true
    }



    defaultConfig {
       // resolutionStrategy { force 'androidx.core:core-ktx:1.7.0-alpha01' }
        applicationId "com.cybermed.cdoc_patient"

        minSdkVersion 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0.0'


        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // Correct Groovy syntax for passing arguments
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndkVersion = "28.0.12433566"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/jniLibs']
        }
    }
    dataBinding {
        enabled = true
    }
    signingConfigs {
        release {
            //storeFile file("C:\\Users\\joshu\\Desktop\\CDoc Files\\cdoc_certificates\\CDocKey.jks")
            storePassword 'Zhejiang191'
            keyPassword 'Zhejiang191'
            storeFile file('CDocKey.jks')
            keyAlias "key0"
        }
        config {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
           // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.name}-${variant.versionName}.apk"
        }
    }
    flavorDimensions "app"
    productFlavors {
        cdoc {
            dimension "app"
            minSdkVersion 26

            applicationId 'com.cybermed.cdoc_patient'
            targetSdk 36
            versionCode 1
           // versionName '1.3.1.1'
            versionName '1.0.0.0'
            resValue "string", "app_name", "CDoc Patient"
            manifestPlaceholders = [
                    appIcon                        : "@drawable/launcher_icon",
                    //onesignal_app_id               : "21babf71-c723-473c-a7f1-18a3850b1199",
                    onesignal_app_id               : "f614514d-b080-460d-a5e0-47ce4fb21497",
                    onesignal_google_project_number: "REMOTE",

                    GETUI_APP_ID                   : "eKLKxpVsjo5NAiMwUYaz45",
                    GETUI_APP_KEY                  : "p5VuybvK5c9N69UhII3CZ5",
                    GETUI_APP_SECRET               : "Gt0Z78SgvlAEXMuZQiZfq7"
            ]
        }

    }
    namespace 'com.cybermed.cdoc_patient'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

}

def releaseTime() {
    return new Date().format("yyMMdd", TimeZone.getTimeZone("UTC"))
}


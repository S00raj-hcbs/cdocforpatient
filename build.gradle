buildscript {
    ext.kotlin_version = '2.2.10'


    repositories {
        google()
        //jcenter()
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.3.10'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        //classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.8.4'
       // classpath "org.jetbrains.kotlin:kotlin-android-extensions:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.9.6'

        //classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        // classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2' //remove

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.google.com"
        }


//        maven {
//            url "http://mvn.gt.igexin.com/nexus/content/repositories/releases/"
//        }
//        maven {
//            //url "http://dl.bintray.com/microsoftazuremobile/SDK"
//            setAllowInsecureProtocol(true)
//        }
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots"
            setAllowInsecureProtocol(true)
        }

        //For awesomespinner
        //maven { url 'https://jitpack.io' }

        maven { url "https://jitpack.io" }

        //jcenter() put at the end to avoid support resource not found
       // jcenter()


        maven {
            url 'https://sdk.squareup.com/public/android'
        }
    }
}
